{{- if .Values.mockLlm.enabled }}
# Offline, zero-cost stand-in for an OpenAI-compatible LLM. Same image as the router.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mock-llm
  labels: {{- include "router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mockLlm.replicaCount }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-mock-llm }
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mock-llm
        {{- include "router.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mock-llm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "mock_llm.main:app", "--host", "0.0.0.0", "--port", "8001"]
          env:
            - { name: MOCK_LATENCY_MS, value: {{ .Values.mockLlm.latencyMs | quote }} }
            - { name: MOCK_LATENCY_JITTER_MS, value: {{ .Values.mockLlm.jitterMs | quote }} }
            - { name: MOCK_ERROR_RATE, value: {{ .Values.mockLlm.errorRate | quote }} }
            - { name: MOCK_ERROR_STATUS, value: {{ .Values.mockLlm.errorStatus | quote }} }
            - { name: MOCK_ERROR_MODELS, value: {{ .Values.mockLlm.errorModels | quote }} }
            - { name: MOCK_COMPLETION_TOKENS, value: {{ .Values.mockLlm.completionTokens | quote }} }
          ports:
            - containerPort: 8001
          resources:
            {{- toYaml .Values.mockLlm.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mock-llm
  labels: {{- include "router.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-mock-llm }
  ports:
    - name: http
      port: 80
      targetPort: 8001
{{- end }}
