{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-redis }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
spec:
  selector: { app: {{ .Release.Name }}-redis }
  ports:
    - port: 6379
{{- end }}