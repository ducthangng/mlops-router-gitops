# One ArgoCD Application per environment. Same chart, different values file + namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gw-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ducthangng/mlops-router-gitops
    targetRevision: main
    path: charts/ai-gateway
    helm:
      releaseName: gw              # resources are gw-gateway, gw-postgres, gw-redis in every env
      valueFiles: [values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-prod
  syncPolicy:
    automated:
      enabled: true                # written explicitly: a UI rollback turns auto-sync off (lesson 4)
      prune: true                  # removed from Git -> removed from the cluster
      selfHeal: true               # manual kubectl edits are reverted
    syncOptions: [CreateNamespace=true]
